<h1 class="display-2 text-center mb-4">
    Administração de Usuários
</h1>
<div class="admin-page table-responsive">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Username</th>
                <th scope="col">Email</th>
                <th scope="col">Ações</th>
            </tr>
        </thead>
        <tbody class="table-group-divider">
            <tr *ngFor="let user of users; let i = index">
                <th scope="row">{{ i + 1 }}</th>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>
                    <button class="fa-solid fa-pencil btn text-secondaryary" (click)="openEdit(user)"></button>
                    <button class="fa-solid fa-close btn text-danger" (click)="userToDelete.set(user)"></button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<c-modal id="editModal" [visible]="!!userToEdit()" (visibleChange)="!$event && closeEdit()">
    <c-modal-header>
        <h5 cModalTitle>Editar usuário</h5>
        <button (click)="closeEdit()" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
        <div class="modal-body">
            <form [formGroup]="editForm">
                <div class="mb-3">
                    <label for="username">Username</label>
                    <input id="username" type="text" class="form-control" formControlName="username">
                    <div *ngIf="editForm.get('username')?.invalid && (editForm.get('username')?.dirty || editForm.get('username')?.touched)"
                        class="text-danger">
                        Nome de usuário é obrigatório.
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email">Email</label>
                    <input id="email" type="email" class="form-control" formControlName="email">
                    <div *ngIf="editForm.get('email')?.invalid && (editForm.get('email')?.dirty || editForm.get('email')?.touched)"
                        class="text-danger">
                        Insira um email válido.
                    </div>
                </div>
            </form>
        </div>
    </c-modal-body>
    <c-modal-footer>
        <button (click)="closeEdit()" cButton color="secondary">Cancelar</button>
        <button (click)="onSave()" cButton color="primary">Salvar</button>
    </c-modal-footer>
</c-modal>

<c-modal id="deleteModal" [visible]="!!userToDelete()" (visibleChange)="!$event && userToDelete.set(null)">
    <c-modal-header>
        <h5 cModalTitle>Deletar usuário</h5>
        <button (click)="userToDelete.set(null)" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
        Tem certeza que deseja deletar o usuário {{ userToDelete().username }}?
    </c-modal-body>
    <c-modal-footer>
        <button (click)="userToDelete.set(null)" cButton color="secondary">Cancelar</button>
        <button (click)="confirmDelete()" cButton color="danger">Deletar</button>
    </c-modal-footer>
</c-modal>
