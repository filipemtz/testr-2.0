<div class="h4 mb-4">
    Gerenciar arquivos
</div>

<div class="mb-4">
    <div class="mb-4">
        <input type="file" class="form-control me-2 my-1" style="max-width: 700px" multiple
            (change)="selectFiles($event)" />
    </div>
    <div>
        <button class="btn btn-success my-1 btn col-2" [disabled]="!selectedFiles" (click)="uploadFiles()">
            Upload
        </button>
    </div>
</div>

<div *ngIf="progressInfos.length">
    <button type="button" class="btn-close" aria-label="Close" (click)="clearProgressInfos()"></button>
    <div *ngFor="let progressInfo of progressInfos" class="mb-2">
        <span>{{ progressInfo.fileName }}</span>
        <span class="me-2">{{ progressInfo.value }}%</span>
        <c-progress [height]="20" [value]="progressInfo.value" [animated]="true" variant="striped" />
    </div>
</div>

<div *ngIf="message.length" class="alert alert-secondary my-3" role="alert">
    <button type="button" class="btn-close" aria-label="Close" (click)="clearMessages()"></button>
    <ul *ngFor="let msg of message; let i = index">
        <li>{{ msg }}</li>
    </ul>
</div>


@for (file of fileInfos; track file.id) {
<div>
    <button cButton color="danger" (click)="deleteFile(file.id)">
        <i class="bi bi-trash-fill"></i>
    </button>
    {{ file.file_name }}
</div>
}
@empty {
Não existem arquivos para serem exibidos.
}
