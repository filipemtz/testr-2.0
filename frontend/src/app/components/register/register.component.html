<!-- Título do formulário -->
<div class="form-title">
    Crie um Novo Perfil
</div>

<div class="form">
    <form cForm [formGroup]="form" (submit)="submit()">
        <!-- Campo de nome de usuário -->
        <div class="mb-4">
            <c-input-group>
                <input cFormControl matInput type="text" formControlName="username" required
                    placeholder="Nome de usuário" autofocus />
                <span cInputGroupText><i class="bi bi-person-fill"></i></span>
            </c-input-group>
            <!-- Ícone do usuário -->
            <mat-error *ngIf="
        form.get('username')?.invalid &&
        (form.get('username')?.dirty || form.get('username')?.touched)
      ">
                O nome de usuário é obrigatório.
            </mat-error>
        </div>

        <!-- Campo de e-mail -->
        <div class="mb-4">
            <c-input-group>
                <input cFormControl matInput type="email" formControlName="email" required placeholder="E-mail" />
                <span cInputGroupText><i class="bi bi-envelope-at-fill"></i></span>
            </c-input-group>
            <!-- Ícone de e-mail -->
            <mat-error *ngIf="
        form.get('email')?.invalid &&
        (form.get('email')?.dirty || form.get('email')?.touched)
      ">
                Por favor, insira um e-mail válido.
            </mat-error>
        </div>
        <!-- Campo de senha -->
        <div class="mb-4">
            <c-input-group>
                <input cFormControl matInput type="password" formControlName="password" required placeholder="Senha" />
                <span cInputGroupText><i class="bi bi-lock-fill"></i></span>
            </c-input-group>
            <!-- Ícone de cadeado -->
            <mat-error *ngIf="
        form.get('password')?.invalid &&
        (form.get('password')?.dirty || form.get('password')?.touched)
      ">
                <ng-container *ngIf="form.get('password')?.errors?.['required']">
                    A senha é obrigatória.
                </ng-container>
                <ng-container *ngIf="form.get('password')?.errors?.['minlength']">
                    A senha deve ter pelo menos 6 caracteres.
                </ng-container>
            </mat-error>
        </div>
        <!-- Campo de confirmação de senha -->
        <div class="mb-4">
            <c-input-group>
                <input cFormControl matInput type="password" formControlName="password_confirm" required
                    placeholder="Confirmar senha" />
                <span cInputGroupText><i class="bi bi-lock-fill"></i></span>
            </c-input-group>
            <!-- Ícone de cadeado -->
            <mat-error *ngIf="
        form.get('password_confirm')?.invalid &&
        (form.get('password_confirm')?.dirty ||
          form.get('password_confirm')?.touched)
      ">
                Por favor, confirme sua senha.
            </mat-error>
        </div>

        <!-- Opção para selecionar se é professor ou aluno -->
        <div class="d-flex gap-3 mb-4">
            <div class="form-check">
                <input cFormCheckInput type="radio" id="teacher" value="teacher" formControlName="group" />
                <label cFormCheckLabel for="teacher">
                    Professor
                </label>
            </div>

            <div class="form-check">
                <input cFormCheckInput type="radio" id="student" value="student" formControlName="group" />
                <label cFormCheckLabel for="student">
                    Aluno
                </label>
            </div>
        </div>
        <!-- Botão de registro com ícone -->
        <button cButton class="me-1" color="primary" id="register-button" type="submit" [disabled]="form.invalid">
            <mat-icon>person_add</mat-icon>
            <!-- Ícone de adicionar usuário -->
            Registrar
        </button>

    </form>
</div>

<!-- Link para a página de login -->
<div class="mt-4 text-center">
    <a routerLink="/accounts/login">Já tem uma conta? Faça login</a>
</div>
